# Порты вынесены в отдельный диапазон 1xxxx, чтобы проект работал параллельно
# с любыми другими локальными окружениями (их порты: 80, 3000-3001, 3050, 3306,
# 4000, 5173, 5432-5433, 5442, 1025-1027, 8025-8027, 8080-8082, 8093-8094).
#
# Переопределить можно через .env:
#   HTTP_PORT=18080  MAILPIT_UI_PORT=18125  MAILPIT_SMTP_PORT=11125  REDIS_PORT_HOST=16479
#
# Внутри docker-сети порты остаются стандартными (mailpit:1025, redis:6379),
# поэтому MAIL_PORT / REDIS_PORT в .env менять НЕ нужно — приложение ходит
# к контейнерам по именам, а не через хостовой проброс.

services:
    # Контейнер с приложением (PHP + Laravel)
    app:
        build: .
        container_name: gatekeeper-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            - redis

    # Контейнер с веб-сервером Nginx
    web:
        image: nginx:alpine
        container_name: gatekeeper-nginx
        restart: unless-stopped
        ports:
            # 18080 — на него смотрит ngrok, менять осторожно
            - "${HTTP_PORT:-18080}:80"
        volumes:
            - ./:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    # Контейнер с Redis
    redis:
        image: redis:alpine
        container_name: gatekeeper-redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT_HOST:-16479}:6379"

    # 📧 Контейнер для тестирования почты (Mailpit)
    mailpit:
        image: axllent/mailpit:latest
        container_name: gatekeeper-mailpit
        restart: unless-stopped
        ports:
            - "${MAILPIT_UI_PORT:-18125}:8025"   # Веб-интерфейс (http://localhost:18125)
            - "${MAILPIT_SMTP_PORT:-11125}:1025" # SMTP с хоста
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "true" # Принимать любой логин/пароль
            MP_SMTP_AUTH_ALLOW_INSECURE: "true" # Без шифрования (для локалки)
            MP_UI_MESSAGE_VIEWER: "true" # Показывать HTML-версию писем
