# Локальная разработка. Тот же образ, что в проде (infra/app/Dockerfile,
# стадия dev), только код подключён папкой: правки видны сразу, без пересборки.
#
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
#   http://localhost:18080/admin         админка (admin@gatekeeper.local / password)
#   http://localhost:18125               mailpit, все письма приложения
#
# Порты из диапазона 1xxxx, чтобы не пересекаться с другими проектами
# (у них 80, 1025-1027, 3000-3100, 3306, 4000, 5173, 5432-5442, 8025-8094).
# Переопределить: HTTP_PORT, MAILPIT_UI_PORT, MAILPIT_SMTP_PORT в .env.

name: gatekeeper

services:
  app:
    build:
      context: .
      dockerfile: infra/app/Dockerfile
      target: dev
    image: gatekeeper-dev
    container_name: gatekeeper-app
    restart: unless-stopped
    # От своего пользователя WSL: файлы, которые создаёт приложение (логи,
    # база, кеш), остаются твоими, а не root/www-data
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # 18080 — на него смотрит ngrok для DEV-бота
      - "${HTTP_PORT:-18080}:80"
    volumes:
      - ./:/app
    depends_on:
      - mailpit
    # Встроенная проверка образа FrankenPHP стучится в админ-API Caddy, он выключен
    healthcheck:
      disable: true

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: gatekeeper-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-18125}:8025"   # веб-интерфейс
      - "${MAILPIT_SMTP_PORT:-11125}:1025" # SMTP с хоста (из контейнера — mailpit:1025)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
