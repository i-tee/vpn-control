# /etc/strongswan.d/charon-gatekeeper.conf
# Правки charon поверх пакетных дефолтов. На исходном сервере они были
# вписаны прямо в /etc/strongswan.d/charon.conf.
charon {
    # Фрагментация IKE: без неё большие пакеты с сертификатом режутся
    # операторами, и клиент висит на «Подключение…»
    fragmentation = yes
    send_vendor_id = yes
}
